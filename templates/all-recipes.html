<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6f4">
    <title>Your recipes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all-recipes.css') }}">
</head>
<body>
    <div class="recipes-layout">
        <aside id="recipes-sidebar" class="recipes-sidebar">
            <div class="sidebar-header">
                <h2>Your Recipes</h2>
                <a href="/" class="nav-link">+ Upload</a>
            </div>

            <nav class="folder-navigation" aria-label="Recipe folders">
                <div class="folder-heading">Folders</div>
                <div id="folder-list" class="folder-list"></div>
                <form id="create-folder-form" class="create-folder-form">
                    <label for="new-folder-name" class="visually-hidden">New folder name</label>
                    <input id="new-folder-name" type="text" maxlength="80" placeholder="New folder name" required>
                    <button type="submit">Create</button>
                </form>
                <p id="folder-form-error" class="form-error" role="alert"></p>
            </nav>

            <div class="sidebar-filters">
                <input type="search" id="search-input" class="search-input" placeholder="Search recipes..." />
                <div class="filter-row">
                    <label class="filter-toggle">
                        <input type="checkbox" id="favorites-only" />
                        Favorites only
                    </label>
                    <select id="type-filter" class="type-filter">
                        <option value="">All types</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Appetizer">Appetizer</option>
                        <option value="Dessert">Dessert</option>
                    </select>
                </div>
            </div>

            <ul id="recipes-list" class="recipes-list">
                <!-- Recipes loaded by JavaScript -->
            </ul>
        </aside>

        <main class="recipe-detail">
            <button id="back-to-list" class="back-btn" type="button">← Recipes</button>

            <div id="recipe-empty" class="empty-state">
                <p>Select a recipe to view details</p>
            </div>

            <div id="recipe-content" class="recipe-content" style="display: none;">
                <header class="recipe-header">
                    <div class="recipe-header-top">
                        <p id="type" class="meta"></p>
                        <button id="detail-favorite-btn" class="favorite-btn" type="button" aria-label="Toggle favorite">☆</button>
                    </div>
                    <h1 id="title"></h1>
                    <p class="meta-line">
                        <span>Prep Time: <span id="prep-time"></span></span>
                        <span>Cook Time: <span id="cook-time"></span></span>
                        <span>Servings: <span id="servings"></span></span>
                    </p>
                </header>

                <section class="recipe-folders" aria-labelledby="recipe-folders-title">
                    <h2 id="recipe-folders-title">Folders</h2>
                    <div id="recipe-folder-options" class="recipe-folder-options"></div>
                    <p id="recipe-folder-error" class="form-error" role="alert"></p>
                </section>

                <section class="recipe-section">
                    <h2>Ingredients</h2>
                    <ul id="ingredients"></ul>
                </section>

                <section class="recipe-section">
                    <h2>Instructions</h2>
                    <ol id="instructions"></ol>
                </section>

                <footer class="notes">
                    <h2>Additional Notes</h2>
                    <ul id="additional-notes"></ul>
                    <p id="source" class="muted"></p>
                    <p id="language" class="muted"></p>
                    <button id="delete-recipe-btn" class="delete-btn" type="button">Delete recipe</button>
                </footer>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/all-recipes.js') }}"></script>
</body>
</html>
