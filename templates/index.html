<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yummy recipe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="recipe-nav">
        <a href="/">Upload another</a>
        <a href="/all-recipes">View all recipes</a>
    </nav>

    <div id="structure" class="structure">
        <header class="recipe-header">
            <div class="recipe-header-top">
                <p id="type" class="meta"></p>
                <button id="favorite-btn" class="favorite-btn" type="button" aria-label="Toggle favorite" style="display: none;">☆</button>
            </div>
            <h1 id="title"></h1>
            <p class="meta-line">
                <span>Prep Time: <span id="prep-time"></span></span>
                <span>Cook Time: <span id="cook-time"></span></span>
                <span>Servings: <span id="servings"></span></span>
            </p>
        </header>

        <section class="recipe-section">
            <h2>Ingredients</h2>
            <ul id="ingredients"></ul>
        </section>

        <section class="recipe-section">
            <h2>Instructions</h2>
            <ol id="instructions"></ol>
        </section>

        <footer class="notes">
            <h2>Additional Notes</h2>
            <ul id="additional-notes"></ul>
            <p id="source" class="muted"></p>
            <p id="language" class="muted"></p>
            <button id="delete-recipe-btn" class="delete-btn" type="button" style="display: none;">Delete recipe</button>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/recipe.js') }}"></script>
</body>
</html>
